name: Deploy Sound Cocktail Worker

# Deploys the TanStack Start build to Cloudflare Workers.
# Runs only on pushes to the main branch; the live site on main
# (Cloudflare Pages) is untouched.
# Payment secrets are NOT set here: until they exist the Worker returns
# 503 PAYMENT_NOT_CONFIGURED on payment endpoints, which the checkout
# already handles. Add them later via `wrangler secret put` once the
# Alipay signing is done (or via the sandbox values for a sandbox test).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The branch inherits main's Vite-SPA files; the Start build must
      # not see the old config/entry. (Snapshot pushes cannot delete.)
      - name: Remove stale Vite-SPA files
        run: rm -f vite.config.mjs index.html src/main.jsx

      - run: npm ci

      - name: Ensure KV namespaces
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          get_id() {
            npx wrangler kv namespace list | jq -r --arg t "$1" '.[] | select(.title==$t) | .id' | head -n1
          }
          ensure_ns() {
            # $1 = namespace title to find; remaining args = create args.
            # Re-queries the list after creating, because the create
            # output format varies; parsing the output is only a fallback.
            local title="$1"; shift
            local id out
            id=$(get_id "$title")
            if [ -z "$id" ] || [ "$id" = "null" ]; then
              out=$(npx wrangler kv namespace create "$@" 2>&1)
              echo "$out" >&2
              id=$(get_id "$title")
              if [ -z "$id" ] || [ "$id" = "null" ]; then
                id=$(echo "$out" | grep -oE '"preview_id": *"[^"]+"' | head -n1 | cut -d'"' -f4)
              fi
              if [ -z "$id" ] || [ "$id" = "null" ]; then
                id=$(echo "$out" | grep -oE '"id": *"[^"]+"' | head -n1 | cut -d'"' -f4)
              fi
              if [ -z "$id" ] || [ "$id" = "null" ]; then
                id=$(echo "$out" | grep -oE 'id = "[^"]+"' | head -n1 | sed 's/id = "//; s/"//')
              fi
            fi
            echo "$id"
          }
          PROD_ID=$(ensure_ns "ORDERS_KV" "ORDERS_KV")
          PREVIEW_ID=$(ensure_ns "ORDERS_KV_preview" "ORDERS_KV" --preview)
          echo "KV prod=$PROD_ID preview=$PREVIEW_ID"
          test -n "$PROD_ID" && test -n "$PREVIEW_ID"
          # wrangler.jsonc has comments (JSONC), so patch the ids with
          # sed instead of parsing it as JSON.
          sed -i "s/4519ca13-85c1-4751-b0e9-5c714be17964/$PROD_ID/; s/9da35d08-bad2-4f32-9278-e1952b020496/$PREVIEW_ID/" wrangler.jsonc
          grep "$PROD_ID" wrangler.jsonc
          grep "$PREVIEW_ID" wrangler.jsonc

      - name: Build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run deploy 2>&1 | tee /tmp/deploy.log
          grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -n1 | tee /tmp/worker-url.txt

      - name: Smoke test
        run: |
          URL=$(cat /tmp/worker-url.txt)
          echo "Worker URL: $URL"
          test -n "$URL"
          # A new version can take a couple of minutes to reach every
          # edge, so retry the homepage instead of failing at once.
          for i in 1 2 3 4 5 6; do
            if curl -sf "$URL/" -o /tmp/home.html; then break; fi
            echo "homepage not ready yet (attempt $i/6), waiting 20s..."
            sleep 20
          done
          grep -o "<title>[^<]*</title>" /tmp/home.html
          curl -sf "$URL/api/products"
          echo
          curl -sf "$URL/health"
          echo
