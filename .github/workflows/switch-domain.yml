name: Switch soundcocktail.app to Worker

# One-time: move soundcocktail.app from the Pages project (sound-lab)
# to the Worker (sound-cocktail). Run manually via workflow_dispatch.
# The Worker attach refuses while the hostname still has DNS records
# left over from Pages (error 100117), so this workflow first deletes
# the A / AAAA / CNAME records for the exact hostname, then attaches.
# MX / TXT / other types are left alone. Downtime is a few seconds.

on:
  workflow_dispatch:
  push:
    branches: [tanstack-start]

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - name: Remove domain from Pages, clear DNS, attach to Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          API=https://api.cloudflare.com/client/v4
          echo "--- remove from Pages project sound-lab (may already be gone) ---"
          curl -s -X DELETE "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/sound-lab/domains/soundcocktail.app" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | tee /tmp/pages-delete.json || true
          echo
          echo "--- find zone and delete leftover A/AAAA/CNAME records ---"
          ZONE_ID=$(curl -s "$API/zones?name=soundcocktail.app" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result[0].id')
          echo "zone_id=$ZONE_ID"
          test -n "$ZONE_ID" && test "$ZONE_ID" != "null"
          curl -s "$API/zones/$ZONE_ID/dns_records?name=soundcocktail.app&per_page=100" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | tee /tmp/dns-list.json | jq -r '.result[] | [.id, .type, .name, .content] | @tsv'
          for REC_ID in $(jq -r '.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME") | .id' /tmp/dns-list.json); do
            echo "deleting record $REC_ID"
            curl -s -X DELETE "$API/zones/$ZONE_ID/dns_records/$REC_ID" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | tee /tmp/dns-delete.json
            echo
          done
          echo "--- attach to Worker sound-cocktail ---"
          curl -s -X PUT "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"hostname":"soundcocktail.app","service":"sound-cocktail"}' | tee /tmp/worker-domain.json
          echo

      - name: Verify soundcocktail.app serves the Worker
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -sf "https://soundcocktail.app/" -o /tmp/app-home.html; then break; fi
            echo "not ready yet (attempt $i/6), waiting 20s..."
            sleep 20
          done
          grep -o "<title>[^<]*</title>" /tmp/app-home.html
          # The old Pages SPA answers every path with index HTML, so
          # check the bodies, not just the status codes.
          curl -sf "https://soundcocktail.app/api/products" | tee /tmp/app-products.json | grep -q "focus-pack"
          echo
          curl -sf "https://soundcocktail.app/health" | tee /tmp/app-health.json | grep -q '"ok":true'
          echo
