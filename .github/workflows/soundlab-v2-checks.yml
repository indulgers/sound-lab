name: Sound Lab V2 — build and tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The repository still contains files from its pre-TanStack SPA era.
      # Match the clean-up already used in the existing Worker deployment job.
      - name: Remove stale SPA files
        run: rm -f vite.config.mjs index.html src/main.jsx
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
